name: important_dates
description: "Important Dates - renewal, expiry and travel document organiser for iOS, macOS and Android."
publish_to: 'none'

# Version 3, Build 66 (Flutter port of the native iOS ImportantDates_v3_Build61 project).
version: 3.0.0+66

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  intl: '>=0.19.0 <0.21.0'
  uuid: ^4.5.1
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  file_picker: ^10.3.3
  share_plus: ^11.1.0
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  pdf: ^3.11.3
  # Cloud Sync (Firebase), as in MyTravelApp-FL.
  firebase_core: ">=3.0.0 <6.0.0"
  firebase_auth: ">=5.0.0 <8.0.0"
  cloud_firestore: ">=5.0.0 <8.0.0"
  firebase_storage: ">=12.0.0 <16.0.0"
  # Google Drive sync for the public edition (flavor "public").
  google_sign_in: ^7.1.0
  googleapis: ">=13.2.0 <17.0.0"
  http: ^1.2.2
  # Shared document storage used by all my apps (Flutter Apps/document-store).
  document_store:
    path: ../../document-store/packages/document_store

# image 4.11.0 (pulled in by pdf) calls ZLibDecoder.decodeLazy, which the
# resolved archive 4.0.x does not have. Pin image to a release that builds.
dependency_overrides:
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
